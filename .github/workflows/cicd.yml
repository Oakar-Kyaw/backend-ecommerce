name: CICD

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
    types:
      - closed

env:
  REGISTRY_USER: ${{ secrets.DOCKER_USERNAME }}
  REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push Docker Compose services
        run: |
          docker --version
          docker compose build
          docker compose push

  deploy:
    needs: build
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "🔹 Navigate to project folder"
            cd /home/ubuntu/megasmart-backend

            echo "🔹 Pull latest Docker images via Compose"
            docker compose pull

            echo "🔹 Stop old containers if running"
            docker compose down || true

            echo "🔹 Start containers with Docker Compose"
            docker compose up -d

            echo "🧹 Clean up unused images"
            docker image prune -af || true

            echo "🎉 Deployment complete!"
