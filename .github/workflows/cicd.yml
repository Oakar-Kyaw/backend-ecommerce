name: CICD

on:
  push:
    branches: [ master ]

jobs:
  docker-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd /home/ubuntu/megasmart-backend
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            sudo git pull https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/megasmartcart/megasmart-backend.git
            sudo npm install -g @nestjs/cli pm2
            sudo npm ci
            sudo npm run prisma:all
            sudo npm run production:build
            sudo pm2 stop all || true
            sudo npm run production:start
            echo "Deployed Successfully"