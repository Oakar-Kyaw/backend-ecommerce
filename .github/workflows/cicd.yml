name: CICD

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
    types: [ closed ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      REGISTRY_USER: ${{ secrets.DOCKER_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create .env file from repo environment variables
        run: |
          cat <<EOF > .env
          ENVIRONMENT=${{ vars.ENVIRONMENT }}
          USER_DB_URL=${{ vars.USER_DB_URL }}
          USER_SERVER_PORT=${{ vars.USER_SERVER_PORT }}
          USER_SERVER_TCP=${{ vars.USER_SERVER_TCP }}
          USER_SERVER_URL=${{ vars.USER_SERVER_URL }}
          AUTH_DB_URL=${{ vars.AUTH_DB_URL }}
          AUTH_SERVER_PORT=${{ vars.AUTH_SERVER_PORT }}
          AUTH_SERVER_TCP=${{ vars.AUTH_SERVER_TCP }}
          AUTH_SERVER_URL=${{ vars.AUTH_SERVER_URL }}
          PRODUCT_DB_URL=${{ vars.PRODUCT_DB_URL }}
          NOTIFICATION_DB_URL=${{ vars.NOTIFICATION_DB_URL }}
          NOTIFICATION_SERVER_PORT=${{ vars.NOTIFICATION_SERVER_PORT }}
          NOTIFICATION_SERVER_TCP=${{ vars.NOTIFICATION_SERVER_TCP }}
          CHAT_DB_URL=${{ vars.CHAT_DB_URL }}
          CHAT_SERVER_PORT=${{ vars.CHAT_SERVER_PORT }}
          CHAT_GATEWAY_PORT=${{ vars.CHAT_GATEWAY_PORT }}
          JWT_SECRET=${{ vars.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ vars.JWT_REFRESH_SECRET }}
          API_GATEWAY_PORT=${{ vars.API_GATEWAY_PORT }}
          FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL=${{ vars.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY="${{ vars.FIREBASE_PRIVATE_KEY }}"
          SMTP_HOST=${{ vars.SMTP_HOST }}
          SMTP_PORT=${{ vars.SMTP_PORT }}
          SMTP_USER=${{ vars.SMTP_USER }}
          SMTP_PASS=${{ vars.SMTP_PASS }}
          REDIS_HOST=${{ vars.REDIS_HOST }}
          REDIS_PORT=${{ vars.REDIS_PORT }}
          REDIS_PASSWORD=${{ vars.REDIS_PASSWORD }}
          PORT=${{ vars.PORT }}
          GOOGLE_ANDROID_CLIENTID=${{ vars.GOOGLE_ANDROID_CLIENTID }}
          GOOGLE_IOS_CLIENTID=${{ vars.GOOGLE_IOS_CLIENTID }}
          GOOGLE_CLIENT_SECRET=${{ vars.GOOGLE_CLIENT_SECRET }}
          GOOGLE_AUTH_CALLBACK_URL=${{ vars.GOOGLE_AUTH_CALLBACK_URL }}
          GOOGLE_USER_CALLBACK_URL=${{ vars.GOOGLE_USER_CALLBACK_URL }}
          GOOGLE_TOKEN_URL=${{ vars.GOOGLE_TOKEN_URL }}
          GOOGLE_AUTH_URL=${{ vars.GOOGLE_AUTH_URL }}
          FACEBOOK_APP_ID=${{ vars.FACEBOOK_APP_ID }}
          FACEBOOK_CLIENT_SECRET=${{ vars.FACEBOOK_CLIENT_SECRET }}
          FACEBOOK_AUTH_CALLBACK_URL=${{ vars.FACEBOOK_AUTH_CALLBACK_URL }}
          FACEBOOK_USER_CALLBACK_URL=${{ vars.FACEBOOK_USER_CALLBACK_URL }}
          EOF

      - name: Build and push Docker Compose images
        run: |
          docker compose build
          docker compose push

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/megasmart-backend
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            sudo docker compose down || true
            sudo docker compose pull || true
            sudo docker compose --env-file .env up -d 
            sudo docker image prune -af
            echo "🎉 Deployment complete!"
