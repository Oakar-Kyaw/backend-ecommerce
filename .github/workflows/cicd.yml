name: CICD

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
    types: [ closed ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      REGISTRY_USER: ${{ secrets.DOCKER_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create .env file
        run: |
          echo "ENVIRONMENT=${{ secrets.ENVIRONMENT }}" >> .env
          echo "USER_DB_URL=${{ secrets.USER_DB_URL }}" >> .env
          echo "USER_SERVER_PORT=${{ secrets.USER_SERVER_PORT }}" >> .env
          echo "USER_SERVER_TCP=${{ secrets.USER_SERVER_TCP }}" >> .env
          echo "USER_SERVER_URL=${{ secrets.USER_SERVER_URL }}" >> .env
          echo "AUTH_DB_URL=${{ secrets.AUTH_DB_URL }}" >> .env
          echo "AUTH_SERVER_PORT=${{ secrets.AUTH_SERVER_PORT }}" >> .env
          echo "AUTH_SERVER_TCP=${{ secrets.AUTH_SERVER_TCP }}" >> .env
          echo "AUTH_SERVER_URL=${{ secrets.AUTH_SERVER_URL }}" >> .env
          echo "PRODUCT_DB_URL=${{ secrets.PRODUCT_DB_URL }}" >> .env
          echo "NOTIFICATION_DB_URL=${{ secrets.NOTIFICATION_DB_URL }}" >> .env
          echo "NOTIFICATION_SERVER_PORT=${{ secrets.NOTIFICATION_SERVER_PORT }}" >> .env
          echo "NOTIFICATION_SERVER_TCP=${{ secrets.NOTIFICATION_SERVER_TCP }}" >> .env
          echo "CHAT_DB_URL=${{ secrets.CHAT_DB_URL }}" >> .env
          echo "CHAT_SERVER_PORT=${{ secrets.CHAT_SERVER_PORT }}" >> .env
          echo "CHAT_GATEWAY_PORT=${{ secrets.CHAT_GATEWAY_PORT }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}" >> .env
          echo "API_GATEWAY_PORT=${{ secrets.API_GATEWAY_PORT }}" >> .env
          echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> .env
          echo "FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}" >> .env
          echo "FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }}" >> .env
          echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> .env
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> .env
          echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> .env
          echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> .env
          echo "REDIS_HOST=${{ secrets.REDIS_HOST }}" >> .env
          echo "REDIS_PORT=${{ secrets.REDIS_PORT }}" >> .env
          echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env
          echo "GOOGLE_ANDROID_CLIENTID=${{ secrets.GOOGLE_ANDROID_CLIENTID }}" >> .env
          echo "GOOGLE_IOS_CLIENTID=${{ secrets.GOOGLE_IOS_CLIENTID }}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
          echo "GOOGLE_AUTH_CALLBACK_URL=${{ secrets.GOOGLE_AUTH_CALLBACK_URL }}" >> .env
          echo "GOOGLE_USER_CALLBACK_URL=${{ secrets.GOOGLE_USER_CALLBACK_URL }}" >> .env
          echo "GOOGLE_TOKEN_URL=${{ secrets.GOOGLE_TOKEN_URL }}" >> .env
          echo "GOOGLE_AUTH_URL=${{ secrets.GOOGLE_AUTH_URL }}" >> .env
          echo "FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}" >> .env
          echo "FACEBOOK_CLIENT_SECRET=${{ secrets.FACEBOOK_CLIENT_SECRET }}" >> .env
          echo "FACEBOOK_AUTH_CALLBACK_URL=${{ secrets.FACEBOOK_AUTH_CALLBACK_URL }}" >> .env
          echo "FACEBOOK_USER_CALLBACK_URL=${{ secrets.FACEBOOK_USER_CALLBACK_URL }}" >> .env

      - name: Build and push Docker Compose images
        run: |
          docker compose build
          docker compose push

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/megasmart-backend
            sudo git pull https://github.com/megasmartcart/megasmart-backend.git
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            sudo docker compose down || true
            sudo docker compose --env-file .env up -d --build
            sudo docker image prune -af
            echo "🎉 Deployment complete!"
