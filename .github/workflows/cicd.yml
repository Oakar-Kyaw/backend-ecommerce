name: CICD

on:
  push:
    branches: [ master ]

jobs:
  docker-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push images
        run: |
          docker build -t oakarkyaw/auth:latest --build-arg APP_NAME=auth --build-arg APP_PORT=5003 .
          docker build -t oakarkyaw/user:latest --build-arg APP_NAME=user --build-arg APP_PORT=5001 .
          docker build -t oakarkyaw/product:latest --build-arg APP_NAME=product --build-arg APP_PORT=5004 .
          docker push oakarkyaw/auth:latest
          docker push oakarkyaw/user:latest
          docker push oakarkyaw/product:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd /home/ubuntu/megasmart-backend
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            sudo git pull https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/megasmartcart/megasmart-backend.git
            docker compose pull
            docker compose up -d
            docker image prune -af
