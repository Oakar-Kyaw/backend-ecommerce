name: CICD

on:
  push:
    branches: [ master ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      rebuild_user: ${{ steps.detect.outputs.rebuild_user }}
      rebuild_product: ${{ steps.detect.outputs.rebuild_product }}
      rebuild_auth: ${{ steps.detect.outputs.rebuild_auth }}
      rebuild_all: ${{ steps.detect.outputs.rebuild_all }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        id: detect
        run: |
          git fetch origin master --depth=1
          changed_files=$(git diff --name-only origin/master)
          echo "Changed files:"
          echo "$changed_files"

          rebuild_user=false
          rebuild_product=false
          rebuild_auth=false
          rebuild_all=false

          for file in $changed_files; do
            if [[ "$file" == apps/user/* ]]; then
              rebuild_user=true
            elif [[ "$file" == apps/product/* ]]; then
              rebuild_product=true
            elif [[ "$file" == apps/auth/* ]]; then
              rebuild_auth=true
            else
              rebuild_all=true
            fi
          done

          echo "rebuild_user=$rebuild_user" >> $GITHUB_OUTPUT
          echo "rebuild_product=$rebuild_product" >> $GITHUB_OUTPUT
          echo "rebuild_auth=$rebuild_auth" >> $GITHUB_OUTPUT
          echo "rebuild_all=$rebuild_all" >> $GITHUB_OUTPUT

  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push user service
        if: needs.detect-changes.outputs.rebuild_user == 'true' || needs.detect-changes.outputs.rebuild_all == 'true'
        run: |
          docker build --build-arg APP_NAME=user --build-arg APP_PORT=5001 -t oakarkyaw/user:latest ./apps/user
          docker push oakarkyaw/user:latest

      - name: Build & Push product service
        if: needs.detect-changes.outputs.rebuild_product == 'true' || needs.detect-changes.outputs.rebuild_all == 'true'
        run: |
          docker build --build-arg APP_NAME=product --build-arg APP_PORT=5004 -t oakarkyaw/product:latest ./apps/product
          docker push oakarkyaw/product:latest

      - name: Build & Push auth service
        if: needs.detect-changes.outputs.rebuild_auth == 'true' || needs.detect-changes.outputs.rebuild_all == 'true'
        run: |
          docker build --build-arg APP_NAME=auth --build-arg APP_PORT=5003 -t oakarkyaw/auth:latest ./apps/auth
          docker push oakarkyaw/auth:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd /home/ubuntu/megasmart-backend

            docker pull oakarkyaw/user:latest
            docker pull oakarkyaw/product:latest
            docker pull oakarkyaw/auth:latest

            docker stop user || true
            docker rm user || true
            docker stop product || true
            docker rm product || true
            docker stop auth || true
            docker rm auth || true

            docker run -d --name user --env-file /home/ubuntu/megasmart-backend/.env -p 5001:5001 -v /home/ubuntu/megasmart-backend/logs/user:/var/log/nestapp --network ecom oakarkyaw/user:latest
            docker run -d --name product --env-file /home/ubuntu/megasmart-backend/.env -p 5004:5004 -v /home/ubuntu/megasmart-backend/logs/product:/var/log/nestapp --network ecom oakarkyaw/product:latest
            docker run -d --name auth --env-file /home/ubuntu/megasmart-backend/.env -p 5003:5003 -v /home/ubuntu/megasmart-backend/logs/auth:/var/log/nestapp --network ecom oakarkyaw/auth:latest

            echo "🔥 Deployment completed successfully!"
