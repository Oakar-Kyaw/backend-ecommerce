version: "3.8"

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "81:80"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/conf.d/default.conf
    depends_on:
      - user
      - auth
      - product
    networks:
      - ecom

  user:
    image: oakarkyaw/user:latest
    container_name: user
    restart: unless-stopped
    env_file: .env
    networks:
      - ecom

  product:
    image: oakarkyaw/product:latest
    container_name: product
    restart: unless-stopped
    env_file: .env
    networks:
      - ecom

  auth:
    image: oakarkyaw/auth:latest
    container_name: auth
    restart: unless-stopped
    env_file: .env
    networks:
      - ecom

  user_db:
    image: postgres:17
    container_name: user_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: megasmart_user
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    volumes:
      - user_data:/var/lib/postgresql/data
    networks:
      - ecom

  product_db:
    image: postgres:17
    container_name: product_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: megasmart_product
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD}
    volumes:
      - product_data:/var/lib/postgresql/data
    networks:
      - ecom

  auth_db:
    image: postgres:17
    container_name: auth_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: megasmart_auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - auth_data:/var/lib/postgresql/data
    networks:
      - ecom

  order_db:
    image: mongo:6
    container_name: order_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: megasmart_order
      MONGO_INITDB_ROOT_PASSWORD: ${ORDER_DB_PASSWORD}
    volumes:
      - order_db_data:/data/db
    networks:
      - ecom

  payment_db:
    image: mongo:6
    container_name: payment_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: megasmart_payment
      MONGO_INITDB_ROOT_PASSWORD: ${PAYMENT_DB_PASSWORD}
    volumes:
      - payment_db_data:/data/db
    networks:
      - ecom

  social_db:
    image: mongo:6
    container_name: social_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: megasmart_social
      MONGO_INITDB_ROOT_PASSWORD: ${SOCIAL_DB_PASSWORD}
    volumes:
      - social_db_data:/data/db
    networks:
      - ecom

  delivery_db:
    image: mongo:6
    container_name: delivery_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: megasmart_delivery
      MONGO_INITDB_ROOT_PASSWORD: ${DELIVERY_DB_PASSWORD}
    volumes:
      - delivery_db_data:/data/db
    networks:
      - ecom

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    volumes:
      - redis_data:/data
    networks:
      - ecom

volumes:
  user_data:
  product_data:
  auth_data:
  order_db_data:
  payment_db_data:
  social_db_data:
  delivery_db_data:
  redis_data:

networks:
  ecom:
    driver: bridge
