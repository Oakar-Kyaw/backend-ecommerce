version: "3.8"

services:

  order:
    image: oakarkyaw/order:latest
    container_name: order
    restart: unless-stopped
    env_file: .env
    networks:
      - ecom
    volumes:
      - ./logs/order:/var/log/nestapp
  
  payment:
    image: oakarkyaw/payment:latest
    container_name: payment
    restart: unless-stopped
    env_file: .env
    networks:
      - ecom
    volumes:
      - ./logs/payment:/var/log/nestapp

  user:
    image: oakarkyaw/user:latest
    container_name: user
    restart: unless-stopped
    env_file: .env
    networks:
      - ecom
    volumes:
      - ./logs/user:/var/log/nestapp  

  product:
    image: oakarkyaw/product:latest
    container_name: product
    restart: unless-stopped
    env_file: .env
    networks:
      - ecom
    volumes:
      - ./logs/product:/var/log/nestapp

  auth:
    image: oakarkyaw/auth:latest
    container_name: auth
    restart: unless-stopped
    env_file: .env
    networks:
      - ecom
    volumes:
      - ./logs/auth:/var/log/nestapp

networks:
  ecom:
    driver: bridge
