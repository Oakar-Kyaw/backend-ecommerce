version: '3.8'

services:
  # Nginx
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "81:80"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/conf.d/default.conf
    depends_on:
      - user
      - auth
    networks:
      - ecom

  # User Service
  user:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: user
        APP_PORT: 5001
    container_name: user
    image: oakarkyaw/user:latest
    restart: unless-stopped
    # env_file:
    #   - ./.env
    ports:
      - "5001:5001"
    networks:
      - ecom

  # Auth Service
  auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: auth
        APP_PORT: 5003
    container_name: auth
    image: oakarkyaw/auth:latest
    restart: unless-stopped
    # env_file:
    #   - ./.env
    ports:
      - "5003:5003"
    networks:
      - ecom

networks:
  ecom:
    driver: bridge
