version: "3.8"

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "81:80"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/conf.d/default.conf
    depends_on:
      - user
      - auth
    networks:
      - ecom

  user:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: user
        APP_PORT: 5001
    container_name: user
    image: oakarkyaw/user:latest
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env
    depends_on:
      - user_db
      - redis
    networks:
      - ecom
      - pgnet
    
    #product service
  product:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: product
        APP_PORT: 5004
    container_name: product
    image: oakarkyaw/product:latest
    restart: unless-stopped
    ports:
      - "5004:5004"
    env_file:
      - .env
    depends_on:
      - product_db
      - redis
    networks:
      - ecom
      - pgnet

  auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: auth
        APP_PORT: 5003
    container_name: auth
    image: oakarkyaw/auth:latest
    restart: unless-stopped
    ports:
      - "5003:5003"
    env_file:
      - .env
    depends_on:
      - auth_db
      - redis
    networks:
      - ecom
      - pgnet

  user_db:
    image: postgres:17
    container_name: user_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: megasmart_user
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    volumes:
      - user_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - pgnet

  product_db:
    image: postgres:17
    container_name: product_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: megasmart_product
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD}
    volumes:
      - product_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - pgnet

  auth_db:
    image: postgres:17
    container_name: auth_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: megasmart_auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - auth_data:/var/lib/postgresql/data
    ports:
      - "5431:5432"
    networks:
      - pgnet
  
  order_db:
    image: mongo:6
    container_name: order_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: megasmart_order
      MONGO_INITDB_ROOT_PASSWORD: ${ORDER_DB_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - order_db_data:/data/db
    networks:
      - pgnet

  payment_db:
    image: mongo:6
    container_name: payment_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: megasmart_payment
      MONGO_INITDB_ROOT_PASSWORD: ${PAYMENT_DB_PASSWORD}
    ports:
      - "27018:27017"
    volumes:
      - payment_db_data:/data/db
    networks:
      - pgnet

  social_db:
    image: mongo:6
    container_name: social_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: megasmart_social
      MONGO_INITDB_ROOT_PASSWORD: ${SOCIAL_DB_PASSWORD}
    ports:
      - "27019:27017"
    volumes:
      - social_db_data:/data/db
    networks:
      - pgnet

  deliver_db:
    image: mongo:6
    container_name: deliver_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: megasmart_delivery
      MONGO_INITDB_ROOT_PASSWORD: S{DELIVERY_DB_PASSWORD}
    ports:
      - "27020:27017"
    volumes:
      - deliver_db_data:/data/db
    networks:
      - pgnet

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - pgnet

volumes:
  user_data:
  product_data:
  auth_data:
  order_db_data:
  payment_db_data:
  social_db_data:
  delivery_db_data:
  redis_data:

networks:
  ecom:
    driver: bridge
  pgnet:
    driver: bridge
